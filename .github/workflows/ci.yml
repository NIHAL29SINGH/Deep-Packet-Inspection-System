name: Build and smoke test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    defaults:
      run:
        working-directory: Packet_analyzer-main/java-port
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # verify = compile + tests + JaCoCo coverage gate + runnable jar
      - name: Build, test and enforce coverage
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Validate shell tooling
        run: bash -n dpi.sh && bash -n smoke-test.sh

      - name: Run offline smoke test
        run: ./smoke-test.sh

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-java-${{ matrix.java }}
          path: |
            Packet_analyzer-main/java-port/target/surefire-reports
            Packet_analyzer-main/java-port/target/site/jacoco
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    needs: java
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t dpi-sentinel .
      - name: Run the container against the bundled sample
        run: |
          docker run --rm -v "$PWD/Packet_analyzer-main:/data" dpi-sentinel \
            /data/sample_traffic.pcap /tmp/out.pcap --no-metrics | tee /tmp/run.log
          grep -q "PROCESSING REPORT" /tmp/run.log

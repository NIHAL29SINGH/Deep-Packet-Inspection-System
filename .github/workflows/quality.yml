name: Static quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Checkstyle
        run: mvn --batch-mode -f Packet_analyzer-main/java-port/pom.xml checkstyle:check -Dcheckstyle.failOnViolation=false
      - name: SpotBugs
        run: mvn --batch-mode -f Packet_analyzer-main/java-port/pom.xml compile com.github.spotbugs:spotbugs-maven-plugin:4.8.6.6:spotbugs
      - name: Dependency analysis
        run: mvn --batch-mode -f Packet_analyzer-main/java-port/pom.xml dependency:analyze -DfailOnWarning=false

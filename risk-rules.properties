# DPI Sentinel explainable-risk tuning.
# Scores are capped at 100. Ports are comma-separated.
blocked_flow_score=100
cleartext_port_score=45
sensitive_port_score=35
high_risk_port_score=45
missing_sni_score=25
unknown_application_score=10
outbound_asymmetry_score=20
unusual_domain_score=15
outbound_asymmetry_bytes=100000
outbound_asymmetry_ratio=20
cleartext_ports=23,2323
sensitive_ports=445,3389
high_risk_ports=4444,1337,31337
missing_sni_with_dns_score=10
suspicious_ja3_score=40
deprecated_tls_score=15
dns_tunnel_score=30
# A DNS label this long, without hyphens and with at least this many bits of entropy per character, looks like encoded data.
dns_tunnel_label_length=24
dns_tunnel_entropy=3.5
# This many distinct names under one parent domain from one client is a classic tunnelling pattern.
dns_tunnel_min_queries=20
# Comma-separated JA3 fingerprints (32 hex characters) to flag, for example from threat-intelligence feeds.
suspicious_ja3=
